# Nœud bootstrap HyperDHT (Hyperswarm) auto-hébergé.
# Commande réelle vérifiée dans hyperdht@6.34.0/bin.js :
#   hyperdht --bootstrap --host <ip publique> [--port 49737]
# `--host` est obligatoire (erreur « You need to specify --host <node ip> » sinon) ; le port
# par défaut est 49737/UDP. Le nœud doit connaître sa propre IP publique : mode réseau « host ».
#
# Démarrage : cp .env.example .env (mettre PUBLIC_IP) && docker compose up -d
# Pare-feu : ouvrir 49737/udp.

services:
  bootstrap:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["hyperdht", "--bootstrap", "--host", "${PUBLIC_IP}", "--port", "${PORT:-49737}"]
    deploy:
      resources:
        limits:
          memory: 256M
