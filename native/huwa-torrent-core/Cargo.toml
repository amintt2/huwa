[package]
name = "huwa-torrent-core"
version = "0.1.0"
edition = "2021"
# librqbit 9 is edition 2024 and uses let-chains: needs a recent stable toolchain.
rust-version = "1.89"
license = "MIT"
description = "Huwa torrent engine: librqbit session + loopback HTTP Range server, exposed through a C ABI (iOS) and JNI (Android)."
publish = false

[lib]
name = "huwa_torrent_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pinned exactly: the API used here was read from the v9.0.1 sources.
# - default-features = false drops the native TLS (OpenSSL) path, which does not cross-compile to mobile.
# - rust-tls: rustls + ring for trackers over HTTPS and SHA-1.
# - disable-upload: exposes `SessionOptions::disable_upload` (seeding off by default).
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
http = "1"
bytes = "1"
# Already in the tree through librqbit: StreamExt / FuturesUnordered for the swarm probes.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
hex = "0.4"
url = "2"
urlencoding = "2"

# Offline end-to-end start benchmark (local seeders, shaped links, mpv CLI): bench/README.md.
[[example]]
name = "start_bench"
path = "bench/start_bench.rs"

# `--cfg huwa_baseline`: the bench built against the engine before the start fixes (bench/README.md).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(huwa_baseline)"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# "debuginfo", not true: full stripping removes the exported C symbols from the staticlib
# (the app then fails to link `_huwa_torrent_call`). Xcode strips the final binary anyway.
strip = "debuginfo"
# Keep unwinding so panics never cross the FFI boundary uncaught (see ffi.rs catch_unwind).
panic = "unwind"

# Upstream 0.7.0 only enables the Apple by-index bind path on macOS, so iOS fails to compile
# (`bind_device` is Linux-only in socket2). Local copy with a one-line cfg fix; drop when fixed upstream.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "../vendor/librqbit-dualstack-sockets" }
# librqbit 9.0.1 with the start/seek fixes listed in ../vendor/librqbit/HUWA_PATCHES.md (in-flight
# pieces kept on re-selection, idle peers woken when a stream moves). Same version, same API.
librqbit = { path = "../vendor/librqbit" }
