name: CI

on:
  push:
    branches: [main, huwa-v1]
  pull_request:
  # Branch runs on demand (gh workflow run ci.yml --ref <branch>).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint -- --max-warnings=0

      - name: Config Expo (sanity)
        run: npx expo config --type public > /dev/null

      - name: Tests (si un script `test` existe)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "Pas de script test : étape ignorée."
          fi

      - name: Tests P2P (worklet Holepunch, restauration, relais, signalements)
        run: |
          npm run build:worklet
          npm run test:p2p

      - name: Empreinte runtime (informatif)
        run: npx expo-updates fingerprint:generate --platform android | head -c 400 || true

  torrent-engine:
    name: moteur torrent (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/huwa-torrent-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/huwa-torrent-core
      # Tests hors réseau : sélection de fichier, sondes (pair local factice), serveur Range,
      # priorités de lecture, suppression pendant la résolution, arrêt propre. Les tests réseau
      # (essaims publics) sont marqués #[ignore].
      - run: cargo test --locked
