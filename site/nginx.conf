# huwa.mciut.fr (site/Dockerfile). The Huwa web app (single-page, client-side routes) plus the
# legacy site: /get (old landing), /privacy, /terms, /pack, /extensions, AltStore sources and the
# passkey / universal-link association files (served as JSON, no redirect, no extension needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- legacy site ----------

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Universal links (apple-app-site-association → applinks): without the app, /addon and
    # /install show the extensions page, which reads ?url= and &type= itself.
    location ~ ^/(addon|install)/?$ {
        try_files /extensions.html =404;
    }

    # The old landing page (AltStore / SideStore / Obtainium install instructions).
    location = /get {
        try_files /get.html =404;
    }

    location ^~ /altstore/ {
        try_files $uri =404;
    }

    # ---------- web app ----------

    # Hashed bundles, fonts and images: never change under the same name.
    location ^~ /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Service worker, shell, manifest and instance config: always revalidated (the update prompt
    # depends on it). The worker may control the whole origin.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /huwa-config.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Real files first (legacy pages answer with or without .html), then the app's routes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
