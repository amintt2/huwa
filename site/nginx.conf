# Huwa site (Coolify, base directory /site). Same behaviour as the static build pack, plus the
# passkey association files: served as JSON, no redirect, no extension needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Universal links (apple-app-site-association → applinks): without the app, /addon and
    # /install show the extensions page, which reads ?url= and &type= itself.
    location ~ ^/(addon|install)/?$ {
        try_files /extensions.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
